[project]
name = "dev-workflows"
version = "0.1.0"
description = "A full-stack developer's team workflows as LangGraph graphs, powered by Claude."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "anthropic>=1.11",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "langgraph-cli[inmem]>=0.4"]

[project.scripts]
devflow = "dev_workflows.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_workflows"]

[tool.pytest.ini_options]
pythonpath = ["src"]
