# Copy to workspace.yaml (or point $DEVFLOW_WORKSPACE at it). Used by `devflow implement` and `devflow address-review`.
# Relative paths are resolved against this file's folder.

repos:
  shared-lib:
    path: ~/code/shared-lib
    gitlab_project: acme/shared-lib
    base_branch: develop            # branches are cut from a freshly pulled develop; MRs target it
    has_ui: false
    commands:                       # run in this order after every change; the first failure stops the list
      lint: npm run lint
      typecheck: npm run typecheck
      test: npm test
      build: npm run build
  api-service:
    path: ~/code/api-service
    gitlab_project: acme/api-service
    commands:
      lint: ./gradlew spotlessCheck
      test: ./gradlew test
      run: ./gradlew bootRun        # used for the integration/E2E check and shown at the manual test
  web-portal:
    path: ~/code/web-portal
    gitlab_project: acme/web-portal
    has_ui: true                    # needs the Playwright MCP below
    app_url: http://localhost:5173  # where the ticket review's E2E tests reach the running app
    commands:
      lint: pnpm lint
      typecheck: pnpm tsc --noEmit
      test: pnpm test
      run: pnpm dev
    setup_commands: [pnpm install --frozen-lockfile]   # run once in each fresh worktree
    copy_files: [.env.local]        # copied from your clone into each fresh worktree (untracked local files)
    parallel_checks: false          # its tests use a fixed port: checks run one ticket at a time

# MCP servers. Jira needs read + write; Confluence is only ever READ (write tools are never exposed).
# Jira can instead be the MCP server you connected to Claude Code (`claude mcp add ...`): when `jira_server` is not
# listed here, devflow uses Claude Code's server of that name, else one whose name mentions jira or atlassian.
mcp_servers:
  atlassian:
    command: uvx
    args: [mcp-atlassian]
    env:
      JIRA_URL: https://acme.atlassian.net
      JIRA_USERNAME: you@acme.io
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      CONFLUENCE_URL: https://acme.atlassian.net/wiki
      CONFLUENCE_USERNAME: you@acme.io
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN}
  playwright:
    command: npx
    args: ["@playwright/mcp@latest"]

# Or use the MCP servers of your logged-in Claude Code (Pro/Max account connectors such as "claude.ai Atlassian",
# plugin servers, or ones added with `claude mcp add`): no tokens here, Claude Code holds the login. `devflow setup`
# lists them and writes this block; a blank entry uses the default above. Confluence stays read-only either way.
# claude_code_mcp:
#   jira: claude.ai Atlassian
#   confluence: claude.ai Atlassian
#   playwright: ""

jira_server: atlassian
confluence_server: atlassian
jira_user: you@acme.io              # warns if the ticket is assigned to someone else; the standup's "you"

# Tool names default to sooperset/mcp-atlassian. Override any that differ in your server:
# jira_tools: {get_issue: jira_get_issue, add_comment: jira_add_comment, edit_comment: jira_edit_comment, ...}
#   attach: jira_update_issue      (optional) uploads the ticket review's proof screenshots via its `attachments` argument
#   search: jira_search            (optional) JQL search, needed by the standup
#   batch_changelogs: jira_batch_get_changelogs   (optional) the standup's fallback when get_issue returns no changelog
# confluence_tools: {get_page: confluence_get_page, search: confluence_search, ...}

status_order: [To Do, In Progress, Code Review]   # Jira status only ever moves forward
review_status: Code Review
vcs_prefix: rtk                     # every git/glab call is `rtk git ...` / `rtk glab ...`
state_dir: .devflow                 # SQLite checkpoints, audit log and side-effect ledger
max_fix_attempts: 3                 # automated fix attempts per repo for a whole run, never reset

# Standup / work report: which status moves count (match your board) and the day boundaries' timezone
# (default: your Jira profile's timezone, else this machine's).
# standup: {started_from: Approved, started_to: In Progress, review_status: In Review, timezone: Asia/Ho_Chi_Minh}

# Parallel runs. `repos[].path` above is your own clone: devflow never edits or switches it. Each ticket works in
# its own git worktree, <worktree_root>/<TICKET>/<repo>, so several tickets can run at once.
worktree_root: ~/devflow-worktrees
max_parallel_runs: 3                # `devflow ui` runs this many at once and queues the rest

# Models and global Claude Code skills per step (defaults in src/dev_workflows/routing.py; run `devflow setup`).
# Effort is always medium and cannot be changed here.
ai:
  # models: {haiku: claude-haiku-4-5-20251001, sonnet: claude-sonnet-5-5, opus: claude-opus-5-5}
  domain_skills: []                 # e.g. [insurance-domain]; added to planning and feedback analysis
  steps:                            # override any step: model (haiku/sonnet/opus or a model id) and/or skills
    # gather_context: {model: sonnet}
    # repo_review: {skills: [code-review, sonar]}
  # skill_dirs: [~/.claude/skills, ~/.claude/plugins]

# Cost estimates on the Tokens tab, in USD per million tokens. Claude Code sessions report their own cost; these
# price the direct API calls. A key matches a model id exactly or as a prefix. Edit freely and check them against
# current Anthropic pricing; a model with no entry shows tokens but no cost.
prices:
  claude-opus-5-5:   {input: 4, output: 20, cache_write: 5, cache_read: 0.20}
  claude-sonnet-5-5: {input: 2, output: 10, cache_write: 2.5, cache_read: 0.20}
  claude-haiku-4-5:  {input: 1, output: 5, cache_write: 1.25, cache_read: 0.10}

# `devflow ui` (a local web app; see README).
ui:
  port: 8765
  graph_sources: []                 # extra folders or langgraph.json files whose graphs the UI should list
